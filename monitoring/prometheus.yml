apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"   # pin to a specific version once stable, e.g. "65.5.0"
    helm:
      releaseName: monitoring
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: configserver-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: configserver
  namespaceSelector:
    matchNames:
      - one8pulse
  endpoints:
    - port: http          # ⚠️ confirm this against actual Service port name
      path: /actuator/prometheus
      interval: 15s