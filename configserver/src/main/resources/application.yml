spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics   # added: info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always   # added: useful for debugging, shows component-level status
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # added: tags every metric with service=config-server