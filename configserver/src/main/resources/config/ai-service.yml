
server:
  port: 8083

spring:
  data:
    mongodb:
      uri: ${MONGO_URL}
      database: fitnessrecommendation
  rabbitmq:
    host: one8pulse-rabbitmq.one8pulse.svc.cluster.local
    port: 5672
    username: guest
    password: guest


rabbitmq:
  enabled: true
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking


gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
    key: ${GEMINI_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /
  endpoint:
    health:
      show-details: always
