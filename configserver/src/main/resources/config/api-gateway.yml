spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://one8pulse-user-service.one8pulse.svc.cluster.local:80
          predicates:
            - Path=/api/users/**

        - id: activity-service
          uri: http://one8pulse-activity-service.one8pulse.svc.cluster.local:80
          predicates:
            - Path=/api/activities/**

        - id: ai-service
          uri: http://one8pulse-ai-service.one8pulse.svc.cluster.local:80
          predicates:
            - Path=/api/recommendations/**

        - id: sos-service
          uri: http://one8pulse-sos-service.one8pulse.svc.cluster.local:80
          predicates:
            - Path=/api/sos/**

server:
  port: 8080

jwt:
  secret:
    key: ${JWT_KEY}
  expiration:
    ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true